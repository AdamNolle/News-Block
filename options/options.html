<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>News Block Settings</title>
  <link rel="stylesheet" href="options.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <img src="../assets/icon-128.png" alt="News Block Logo" class="nav-icon" style="width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);" />
        News Block
      </div>
      <p class="subtitle">Customize which news categories to block. News sites from blocked categories are closed instantly.</p>
    </header>

    <div class="controls-wrapper">
      <div class="category-section" style="width: 100%; max-width: 600px; padding: 20px; margin-bottom: 25px; box-sizing: border-box;">
        <h3 class="category-header" style="margin-bottom: 15px;">Global Settings</h3>
        <div class="site-item" style="border: none; background: transparent; padding: 0 0 10px 0; border-bottom: 1px solid var(--border-color); border-radius: 0; margin-bottom: 10px;">
          <span class="domain-name">Show "Kill Switch" toggle in popup menu</span>
          <div class="toggle-group">
            <label class="switch">
              <input type="checkbox" id="showMasterToggleSetting">
              <span class="slider"></span>
            </label>
          </div>
        </div>
        <div class="site-item" style="border: none; background: transparent; padding: 0;">
          <span class="domain-name">Dark Mode</span>
          <div class="toggle-group">
            <label class="switch">
              <input type="checkbox" id="darkModeSetting">
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>

      <div class="add-site-container">
        <input type="text" id="customSiteInput" placeholder="Add custom domain to block (e.g., example.com)" />
        <button id="addSiteBtn">Block Site</button>
      </div>

      <div class="controls">
        <input type="text" id="searchInput" placeholder="Search for a category..." />
      </div>
    </div>

    <div id="categoriesContainer" class="categories-container">
      <!-- Injected by options.js -->
    </div>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
